name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install Neutralino CLI & binaries
        run: npx neu update

      - name: Build frontend & Neutralino package
        run: npm run neu:build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/baojiayi/*

  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 报价易 ${{ github.ref_name }}
          body: |
            ## 报价易 ${{ github.ref_name }}

            ### 下载
            - **Windows**: `baojiayi-win_x64.exe`
            - **macOS**: `baojiayi-mac_x64`
            - **Linux**: `baojiayi-linux_x64`

            每个平台需下载对应文件夹中的所有文件（可执行文件 + `resources.neu`），放在同一目录下运行。

            ### 更新内容
            请查看下方提交记录。
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
